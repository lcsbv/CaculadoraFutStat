<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutStat - Médias e Placares</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>FutStat</h1>

    <!-- TIME A -->
    <div class="box">
      <h2>Time A</h2>
      <div class="grid">
        <div class="linha">
          <label>Total de Jogos:</label>
          <input type="number" id="jogosA" min="1" placeholder="0" />
        </div>
        <div class="linha">
          <label>Gols Marcados:</label>
          <input type="number" id="golsA_marcados" min="0" placeholder="0" />
        </div>
        <div class="linha">
          <label>Gols Sofridos:</label>
          <input type="number" id="golsA_sofridos" min="0" placeholder="0" />
        </div>
      </div>
    </div>

    <!-- TIME B -->
    <div class="box">
      <h2>Time B</h2>
      <div class="grid">
        <div class="linha">
          <label>Total de Jogos:</label>
          <input type="number" id="jogosB" min="1" placeholder="0" />
        </div>
        <div class="linha">
          <label>Gols Marcados:</label>
          <input type="number" id="golsB_marcados" min="0" placeholder="0" />
        </div>
        <div class="linha">
          <label>Gols Sofridos:</label>
          <input type="number" id="golsB_sofridos" min="0" placeholder="0" />
        </div>
      </div>
    </div>

    <!-- RESULTADO -->
    <div class="box resultado-box">
      <h2>Resultados</h2>

      <button id="btn_calcular">CALCULAR</button>

      <pre id="resultado_texto">Insira os dados e clique em Calcular.</pre>

      <button id="btn_download" style="display:none;">BAIXAR RESULTADO</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
