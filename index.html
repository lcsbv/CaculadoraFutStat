<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de Gols</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Calculadora de Média de Gols</h1>

    <div class="box">
        <h2>Time A</h2>
        <div class="grid">
            <div class="linha">
                <label>Gols Marcados</label>
                <input id="a_gm" type="number">
            </div>

            <div class="linha">
                <label>Gols Sofridos</label>
                <input id="a_gs" type="number">
            </div>

            <div class="linha">
                <label>Total de Jogos</label>
                <input id="a_jogos" type="number">
            </div>
        </div>
    </div>

    <div class="box">
        <h2>Time B</h2>
        <div class="grid">
            <div class="linha">
                <label>Gols Marcados</label>
                <input id="b_gm" type="number">
            </div>

            <div class="linha">
                <label>Gols Sofridos</label>
                <input id="b_gs" type="number">
            </div>

            <div class="linha">
                <label>Total de Jogos</label>
                <input id="b_jogos" type="number">
            </div>
        </div>
    </div>

    <button onclick="calcular()">Calcular Médias</button>

    <div class="resultado-box">
        <pre id="resultado"></pre>
    </div>

    <button id="downloadBtn" style="display:none;" onclick="baixarResultado()">
        Baixar Resultado
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
